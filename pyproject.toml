[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot-agent"
version = "1.0.0"
description = "A durable evidence-gap research agent for local scientific papers."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.7",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
semantic = ["fastembed==0.8.0"]
rerank = [
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.18"]

[project.scripts]
paperpilot = "paperpilot_agentic.cli:main"
paperpilot-web = "paperpilot_agentic.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperpilot_agentic = ["web_static/*.html", "web_static/*.css", "web_static/*.js", "web_static/vendor/*.md", "web_static/vendor/katex/*", "web_static/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the baseline gate focused on correctness while legacy style debt is
# migrated incrementally instead of hiding it inside the production refactor.
select = ["E4", "E7", "E9", "F"]
